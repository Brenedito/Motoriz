[project]
name = "motoriz"
version = "0.1.0"
description = "Motoriz: gestão de frota para locadoras (backend)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pymysql>=1.2.4",
    "sqlalchemy>=2.1.9,<2.2",
    "uuid-utils>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["banco: usa MySQL via testcontainers"]

[tool.importlinter]
root_package = "motoriz"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Camadas dentro de cada módulo"
type = "layers"
containers = ["motoriz.contas", "motoriz.auditoria"]
layers = ["adaptadores", "aplicacao", "dominio"]

[[tool.importlinter.contracts]]
name = "Domínio não importa framework"
type = "forbidden"
source_modules = [
    "motoriz.compartilhado",
    "motoriz.contas.dominio",
    "motoriz.auditoria.dominio",
]
forbidden_modules = ["fastapi", "sqlalchemy", "pydantic"]

[[tool.importlinter.contracts]]
name = "Contas não importa o interior de auditoria"
type = "forbidden"
source_modules = ["motoriz.contas"]
forbidden_modules = [
    "motoriz.auditoria.dominio",
    "motoriz.auditoria.aplicacao",
    "motoriz.auditoria.adaptadores",
]

[dependency-groups]
dev = [
    "import-linter>=2.17",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "testcontainers[mysql]>=4.15.0",
]
